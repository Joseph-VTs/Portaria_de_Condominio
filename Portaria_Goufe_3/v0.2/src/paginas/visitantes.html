<section>
    <div class="sub-spa-nav" style="display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem;">
        <button class="btn-action btn-primary active" data-target="novo-cadastro">Novo Registo / Cadastro</button>
        <button class="btn-action" data-target="visitantes-frequentes" style="background:#e2e8f0; color:var(--text-primary);" onclick="UI.carregarListaVisitantesFrequentes()">Visitantes Frequentes</button>
    </div>

    <div id="novo-cadastro" class="sub-spa-content">
        <form onsubmit="UI.salvarVisitante(event, false)" autocomplete="off">
            <fieldset>
                <legend>Registo de Visitantes</legend>
                
                <h4 style="margin: 0.5rem 0 0.75rem 0; color: var(--accent);">Identificação do Veículo</h4>
                <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 0.5rem; margin-bottom: 1.5rem; background: #f8fafc; padding: 1rem; border-radius: 8px; border: 1px dashed var(--border);">
                    <div>
                        <label style="font-size: 0.85rem;">Tipo Placa:</label>
                        <select id="v_tipo_placa">
                            <option value="ANTIGA">Antiga (ABC-1234)</option>
                            <option value="MERCOSUL">Mercosul (ABC1A23)</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-size: 0.85rem;">Placa do Veículo:</label>
                        <input type="text" id="v_placa" placeholder="Digite a placa..." oninput="Validation.aplicarMascaraPlaca(this); UI.buscarAutoPreenchimentoPlaca(this.value)" autocomplete="off">
                    </div>
                    <div>
                        <label style="font-size: 0.85rem;">Modelo:</label>
                        <input type="text" id="v_modelo" placeholder="Ex: Gol" autocomplete="off">
                    </div>
                    <div>
                        <label style="font-size: 0.85rem;">Cor:</label>
                        <input type="text" id="v_cor" placeholder="Ex: Prata" autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label>Data e Hora de Entrada:</label>
                    <input type="datetime-local" id="v_data_hora" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Destino (Proprietário ou Morador):</label>
                    <select id="select-destino-morador" required>
                        <option value="">A carregar destinos...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nome do Visitante:</label>
                    <input type="text" id="v_nome" required placeholder="Ex: Carlos Silva" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Documento:</label>
                    <div style="display: flex; gap: 0.5rem;">
                        <select id="v_tipo_doc" style="width: 120px;"><option value="CPF">CPF</option><option value="RG">RG</option></select>
                        <input type="text" id="v_numero_doc" style="flex:1;" required placeholder="000.000.000-00" autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label>Data de Nascimento:</label>
                    <input type="date" id="v_data_nascimento" autocomplete="off">
                </div>
                <div class="form-group" style="margin-top: 1rem;">
                    <label>Observação:</label>
                    <textarea id="v_observacao" rows="2" placeholder="Ex: Vai visitar o pai / Entregador..." autocomplete="off"></textarea>
                </div>
                <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                    <button type="submit" class="btn-action btn-primary">Salvar como Acesso (Entrada)</button>
                    <button type="button" onclick="UI.salvarVisitante(event, true)" class="btn-action" style="background:var(--success); color:white;">Salvar como Frequente</button>
                </div>
            </fieldset>
        </form>
    </div>

    <div id="visitantes-frequentes" class="sub-spa-content" style="display: none;">
        <h3>Visitantes Frequentes Cadastrados</h3>
        <div id="container-grid-visitantes-frequentes" class="cards-grid" style="margin-top: 1rem;"></div>
    </div>
</section>
