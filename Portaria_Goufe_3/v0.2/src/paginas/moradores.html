<section>
    <div class="sub-spa-nav" style="display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem;">
        <button class="btn-action btn-primary active" data-target="novo-cadastro">Novo Cadastro</button>
        <button class="btn-action" data-target="visualizar-cadastrados" style="background:#e2e8f0; color:var(--text-primary);" onclick="UI.carregarListaMoradores()">Visualizar Cadastrados</button>
    </div>

    <div id="novo-cadastro" class="sub-spa-content">
        <form onsubmit="UI.salvarMorador(event)" autocomplete="off">
            <fieldset>
                <legend>Cadastro de Moradores / Familiares / Inquilinos</legend>
                
                <div class="form-group">
                    <label>Proprietário Responsável (Opcional):</label>
                    <select id="select-proprietario-ref">
                        <option value="">Nenhum / Morador Independente</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Nome Completo (Titular / Principal):</label>
                    <input type="text" id="m_nome" required placeholder="Ex: Maria Oliveira" autocomplete="off">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Grau de Parentesco / Nível:</label>
                        <select id="m_parentesco">
                            <option value="Titular">Titular</option>
                            <option value="Conjuge">Cônjuge</option>
                            <option value="Filho(a)">Filho(a)</option>
                            <option value="Parente">Parente</option>
                            <option value="Inquilino">Inquilino</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Data de Nascimento:</label>
                        <input type="date" id="m_data_nascimento" required autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label>Documento (CPF / RG):</label>
                    <div style="display: flex; gap: 0.5rem;">
                        <select id="m_tipo_doc" style="width: 120px;"><option value="CPF">CPF</option><option value="RG">RG</option></select>
                        <input type="text" id="m_numero_doc" style="flex:1;" required placeholder="000.000.000-00" autocomplete="off">
                    </div>
                </div>
                
                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Rua:</label>
                        <select id="m_rua" required>
                            <option value="">A carregar ruas...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Casa / Lote:</label>
                        <select id="m_casa" required>
                            <option value="">Selecione primeiro a Rua...</option>
                        </select>
                    </div>
                </div>
                
                <!-- Secção de Outros Moradores / Dependentes Adicionais -->
                <h4 style="margin: 1.5rem 0 0.75rem 0; color: var(--accent);">Outros Moradores / Dependentes da Casa</h4>
                <div id="container-moradores-dep-m">
                    <div class="morador-dep-item-m" style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto; gap: 0.5rem; margin-bottom: 0.5rem; align-items: center;">
                        <input type="text" class="mdm_nome" placeholder="Nome Completo" autocomplete="off">
                        <select class="mdm_parentesco">
                            <option value="Dono">Dono</option>
                            <option value="Conjuge">Cônjuge</option>
                            <option value="Filho(a)">Filho(a)</option>
                            <option value="Parente">Parente</option>
                            <option value="Inquilino">Inquilino</option>
                            <option value="Outros">Outros</option>
                        </select>
                        <select class="mdm_tipo_doc">
                            <option value="CPF">CPF</option>
                            <option value="RG">RG</option>
                        </select>
                        <input type="text" class="mdm_num_doc" placeholder="Documento" autocomplete="off">
                        <input type="date" class="mdm_data_nasc">
                        <button type="button" onclick="this.closest('.morador-dep-item-m').remove()" class="btn-action" style="background:#fee2e2; color:#991b1b; padding: 0.5rem 0.75rem; border:none; cursor:pointer;" title="Remover">🗑️</button>
                    </div>
                </div>
                <button type="button" onclick="UI.adicionarCampoMoradorDepMorador()" class="btn-action" style="background:#e2e8f0; color:var(--text-primary); margin-top: 0.5rem;">+ Adicionar Outro Morador/Dependente</button>

                <h4 style="margin: 1.5rem 0 0.75rem 0; color: var(--accent);">Veículos do Morador</h4>
                <div id="container-veiculos-morador">
                    <div class="veiculo-item-m" style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 0.5rem; margin-bottom: 0.5rem;">
                        <input type="text" class="vm_modelo" placeholder="Modelo" autocomplete="off">
                        <input type="text" class="vm_cor" placeholder="Cor" autocomplete="off">
                        <select class="vm_tipo_placa">
                            <option value="ANTIGA">Antiga (ABC-1234)</option>
                            <option value="MERCOSUL">Mercosul (ABC1A23)</option>
                        </select>
                        <input type="text" class="vm_placa" placeholder="Placa" oninput="Validation.aplicarMascaraPlaca(this)" autocomplete="off">
                    </div>
                </div>
                <button type="button" onclick="UI.adicionarCampoVeiculoMorador()" class="btn-action" style="background:#e2e8f0; color:var(--text-primary); margin-top: 0.5rem;">+ Adicionar Outro Veículo</button>

                <div style="margin-top: 2rem;">
                    <button type="submit" class="btn-action btn-primary" style="padding: 0.75rem 1.5rem;">Salvar Morador</button>
                </div>
            </fieldset>
        </form>
    </div>

    <div id="visualizar-cadastrados" class="sub-spa-content" style="display: none;">
        <h3>Moradores Registrados</h3>
        <div id="container-grid-moradores" class="cards-grid" style="margin-top: 1rem;"></div>
    </div>
</section>
