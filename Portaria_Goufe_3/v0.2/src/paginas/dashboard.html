<section>
    <h2 style="margin-bottom: 1rem;">Dashboard de Movimentações</h2>
    <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
        <select style="padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--border);">
            <option>Dia Atual</option>
            <option>Últimos 7 dias</option>
            <option>Últimos 15 dias</option>
            <option>Últimos 30 dias</option>
        </select>
    </div>
    <div style="background: white; padding: 2rem; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow-sm);">
        <canvas id="movimentacaoChart" style="max-height: 400px;"></canvas>
    </div>
</section>
